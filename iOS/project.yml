name: Boilerlog
options:
  bundleIdPrefix: com.shimondeitel.boilerlog
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Boilerlog:
    type: application
    platform: iOS
    sources:
      - path: Boilerlog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.boilerlog
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Boilerlog/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  BoilerlogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BoilerlogTests
      - path: Boilerlog.storekit
    dependencies:
      - target: Boilerlog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.boilerlog.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  BoilerlogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BoilerlogUITests
    dependencies:
      - target: Boilerlog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.boilerlog.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Boilerlog:
    build:
      targets:
        Boilerlog: all
        BoilerlogTests: [test]
        BoilerlogUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Boilerlog.storekit
    test:
      config: Debug
      storeKitConfiguration: Boilerlog.storekit
      targets:
        - BoilerlogTests
        - BoilerlogUITests
    archive:
      config: Release
